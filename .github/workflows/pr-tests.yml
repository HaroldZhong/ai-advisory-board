name: PR Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  deterministic-tests:
    name: Deterministic Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Run deterministic tests
        run: >
          uv run --group dev python -m pytest
          tests/test_app_paths.py
          tests/test_crash_fixes.py
          tests/test_runtime_api_key_config.py
          tests/test_rag_persistence.py
          tests/test_session_budget_cost_accounting.py
          tests/test_budget_cap_enforcement.py
          tests/test_zdr_enforcement.py
          tests/test_advanced_settings_backend_wiring.py
          tests/test_attachment_retention_controls.py
          tests/test_model_registry.py
          tests/test_openrouter_error_classification.py
          tests/test_council_all_fail.py
          tests/test_conversation_creation_defaults.py
          tests/test_conversation_organization.py
          tests/test_metadata_smoke.py
          tests/test_reasoning.py
          tests/test_reasoning_stream.py
          tests/test_reasoning_stream_integration.py
          tests/test_auto_routing_heuristics.py
          tests/test_thinking_effort_backend.py
          -q

  frontend-deterministic-tests:
    name: Deterministic frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run deterministic frontend tests
        run: node --test frontend/tests/advancedSettingsAvailability.test.mjs frontend/tests/advancedRoutingControls.test.mjs frontend/tests/configStatus.test.mjs frontend/tests/conversationCreation.test.mjs frontend/tests/conversationNavigation.test.mjs frontend/tests/conversationOrganization.test.mjs frontend/tests/firstRunSetup.test.mjs frontend/tests/modelPresets.test.mjs frontend/tests/oneShotSignal.test.mjs frontend/tests/optimisticMessages.test.mjs frontend/tests/reasoningDisplay.test.mjs frontend/tests/reasoningMessages.test.mjs frontend/tests/responsiveChatLayout.test.mjs frontend/tests/responsiveLayout.test.mjs frontend/tests/responsiveModalLayout.test.mjs frontend/tests/thinkingEffort.test.mjs frontend/tests/trustState.test.mjs frontend/tests/streamErrors.test.mjs frontend/tests/safeHref.test.mjs

  frontend-e2e-tests:
    name: Frontend Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e
